name: reweave-dev

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reweave
      POSTGRES_PASSWORD: reweave
      POSTGRES_DB: reweave
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reweave"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: python apps/api/manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SECRET_KEY: dev-only-not-a-secret
      DEBUG: "true"
      DATABASE_URL: postgres://reweave:reweave@db:5432/reweave
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/apps/api
    ports: ["8000:8000"]
    volumes: ["..:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: celery -A reweave_workers worker --loglevel=info --queues=default,scan,check,remediate
    environment:
      DJANGO_SECRET_KEY: dev-only-not-a-secret
      DEBUG: "true"
      DATABASE_URL: postgres://reweave:reweave@db:5432/reweave
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app/apps/api
    volumes: ["..:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
