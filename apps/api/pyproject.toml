[project]
name = "reweave-api"
version = "0.0.0"
description = "Django + DRF API: auth, orgs, GitHub App, scans, billing, notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reweave-shared",
  "django>=5.1",                  # D2: batteries (auth, admin, ORM, migrations) shrink solo surface
  "djangorestframework>=3.15",    # D2: API layer
  "psycopg[binary]>=3.2",         # D13: Postgres driver
  "celery[redis]>=5.4",           # D13: Redis-backed job queue
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]
