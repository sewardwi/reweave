[project]
name = "reweave-workers"
version = "0.0.0"
description = "Celery workers: scan, embed, adjudicate, remediate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reweave-engine",
  "reweave-shared",
  "celery[redis]>=5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reweave_workers"]
