[project]
name = "reweave-remediation"
version = "0.0.0"
description = "PR planner, constrained codemods, and the verification harness (Phase 4)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reweave-engine",
  "reweave-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reweave_remediation"]
