[project]
name = "reweave-engine"
version = "0.0.0"
description = "Reweave analysis engine — parsing, fingerprinting, detection. No Django imports."
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.69",
  "reweave-shared",
  "tree-sitter>=0.26.0",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
reweave-audit = "reweave_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reweave_engine"]
