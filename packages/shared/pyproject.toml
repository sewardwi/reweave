[project]
name = "reweave-shared"
version = "0.0.0"
description = "Schemas, event types, and config shared across Reweave services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",  # schema validation at every boundary, incl. LLM output (D11)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reweave_shared"]
