name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  python:
    name: engine · api · workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --frozen

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: typecheck (strict)
        run: uv run pyright

      - name: tests
        run: uv run pytest

      # The merge gate (D12). Scores the TRAIN split — the holdout is evaluated at phase gates
      # only, because a per-PR holdout score is a holdout you are tuning on.
      - name: benchmark gate
        run: uv run python benchmarks/run_bench.py --show-errors --json reports/bench.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: reports/bench.json
          if-no-files-found: ignore

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --frozen
      # Advisory-only until Phase 2. Once we handle customer code, a known-vulnerable dependency
      # blocks the merge: flip continue-on-error to false and remove this comment.
      - name: pip-audit
        continue-on-error: true
        run: uvx pip-audit --strict
